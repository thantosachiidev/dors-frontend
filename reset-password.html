<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dors — Set new password</title>
    <link rel="icon" type="image/png" href="dors-high-resolution-logo-grayscale-transparent.png" />
    <meta
      name="description"
      content="Create a new password for your Dors account."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="signin.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="brand-panel" aria-label="Brand introduction">
        <div class="brand-block">
          <div class="brand-row">
            <img src="dors-high-resolution-logo-grayscale-transparent.png" alt="Dors logo" class="brand-mark" />
            <span class="brand-name">Dors</span>
          </div>
          <p class="tagline">Portfolio builder and marketplace for real work.</p>
        </div>
      </aside>

      <main class="auth-panel">
        <div class="auth-card">
          <p class="eyebrow">Set new password</p>
          <h1>Choose a secure password.</h1>

          <form id="reset-password-form" class="sign-in-form" novalidate>
            <label class="field-label" for="new-password">New password</label>
            <input id="new-password" name="newPassword" type="password" placeholder="Enter a new password" autocomplete="new-password" required />

            <div id="reset-message" class="form-message" aria-live="polite"></div>

            <button class="primary-button" type="submit">Update password</button>
          </form>

          <p class="signup-copy">
            <a href="signin.html" class="text-link">Back to sign in</a>
          </p>
        </div>
      </main>
    </div>

    <script src="./api-config.js"></script>
    <script type="module" src="./reset-password.js"></script>
  </body>
</html>
