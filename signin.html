<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dors — Sign in</title>
    <link rel="icon" type="image/png" href="dors-high-resolution-logo-grayscale-transparent.png" />
    <meta
      name="description"
      content="Sign in to Dors and manage your portfolio, projects, and marketplace sales."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="signin.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="brand-panel" aria-label="Brand introduction">
        <div class="brand-block">
          <div class="brand-row">
            <img src="dors-high-resolution-logo-grayscale-transparent.png" alt="Dors logo" class="brand-mark" />
            <span class="brand-name">Dors</span>
          </div>
          <p class="tagline">Portfolio builder and marketplace for real work.</p>
        </div>
      </aside>

      <main class="auth-panel">
        <div class="auth-card">
          <p class="eyebrow">Welcome back</p>
          <h1>Sign in</h1>

          <button id="google-signin" class="social-button" type="button" aria-label="Continue with Google">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.2-.9 2.3-1.9 3l3.1 2.4c1.8-1.7 2.8-4.2 2.8-7.3 0-.7-.1-1.4-.2-2H12z"/>
              <path fill="#34A853" d="M12 20.3c2.6 0 4.8-.9 6.4-2.3l-3.1-2.4c-.9.6-2 .9-3.3.9-2.5 0-4.7-1.7-5.5-4H.8v2.5A9.3 9.3 0 0 0 12 20.3z"/>
              <path fill="#FBBC05" d="M6.5 18.4A9.1 9.1 0 0 1 6.1 12c0-1 .2-2 .5-2.9L.8 6.6A9.4 9.4 0 0 0 2.7 12c0 1.5.4 3 .9 4.3l3-2.9z"/>
              <path fill="#4285F4" d="M12 3.8c1.4 0 2.7.5 3.7 1.4l2.8-2.8A9.4 9.4 0 0 0 12 0a9.3 9.3 0 0 0-8.3 5.1l3.6 2.8c.8-2.3 2.9-4.1 5.7-4.1z"/>
            </svg>
            Continue with Google
          </button>

          <div class="divider" aria-label="or continue with email">
            <span>or</span>
          </div>

          <form id="signin-form" class="sign-in-form" novalidate>
            <label class="field-label" for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />

            <div class="password-row">
              <label class="field-label" for="password">Password</label>
              <a href="forgot-password.html" class="text-link">Forgot password?</a>
            </div>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />

            <div id="signin-message" class="form-message" aria-live="polite"></div>

            <button class="primary-button" type="submit">Sign in</button>
          </form>

          <p class="signup-copy">
            New to Dors?
            <a href="signup.html" class="text-link">Create an account</a>
          </p>
        </div>
      </main>
    </div>

    <script src="./api-config.js"></script>
    <script type="module" src="./signin.js"></script>
  </body>
</html>
